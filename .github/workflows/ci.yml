name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build e verificação (G2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: ./mvnw verify
        run: ./mvnw -B -ntp verify

  alertas:
    name: Regras de alerta (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: promtool check rules
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/deploy/prometheus:/work:ro"
          prom/prometheus:v3.15.1 check rules /work/alertas.yml
      - name: promtool test rules
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/deploy/prometheus:/work:ro"
          prom/prometheus:v3.15.1 test rules /work/alertas.test.yml

  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
