name: Loadtest

# Teste normal e teste de carga com o k6 (T-033, Q-066, 04 §4): gera as imagens, sobe o profile "apps"
# do compose, roda `smoke` e `load` a 50 req/s e publica docs/performance/results/** como artefato.
# As rodadas de 100 e 200 req/s (informativas, RNF-010) ficam só locais. Manual e noturno.
# Os números de um runner compartilhado não substituem os do relatório (outro ambiente, P8).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: loadtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loadtest:
    name: k6 (smoke e load a 50 req/s)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Configuração local (.env)
        run: cp .env.example .env
      - name: Compilar
        run: ./mvnw -B -ntp -q install -DskipTests
      - name: Gerar as imagens dos serviços
        run: ./mvnw -B -ntp -pl lancamentos-service,consolidado-service spring-boot:build-image -DskipTests
      - name: Sintaxe dos scripts (k6 inspect)
        run: loadtest/run.sh inspect
      - name: Subir o profile apps
        run: docker compose --env-file .env -f deploy/docker-compose.yml --profile apps up -d --wait --remove-orphans
      - name: Teste normal (smoke)
        run: loadtest/run.sh smoke
      - name: Teste de carga (50 req/s)
        env:
          ENV_NOTE: runner ubuntu-latest do GitHub Actions (compartilhado)
        run: loadtest/run.sh load
      - name: Publicar os resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-k6
          path: docs/performance/results/**
          if-no-files-found: warn
      - name: Logs dos contêineres (em caso de falha)
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml --profile apps logs --no-color --tail 200
      - name: Derrubar tudo
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml --profile apps down -v
