openapi: 3.1.0
info:
  title: Fluxo de Caixa - Consolidado
  version: 1.0.0
  description: |
    Consulta do consolidado diário do case Fluxo de Caixa. Contrato *contract-first* (03 §5):
    este arquivo é a fonte única, validado em teste (RNF-014). O comerciante vem só do token
    (claim `merchant_id`, RF-010); valores monetários são strings decimais com 2 casas; erros
    seguem o RFC 9457 (`application/problem+json`) com o catálogo de `type` abaixo.

    O consolidado é uma projeção dos eventos de Lançamentos e pode estar alguns segundos atrás
    (consistência eventual, ADR-005); `atualizadoEm` mostra quando cada dia foi atualizado.
    `saldoDia = (totalCreditos − totalEstornosCredito) − (totalDebitos − totalEstornosDebito)`
    (AC-005.2); `saldoAnterior` soma os `saldoDia` antes do período, e `saldoAcumulado` é
    `saldoAnterior` mais os `saldoDia` até o dia (RF-006). O saldo inicial é zero (A3).

    Catálogo de erros (`type`): `/erros/requisicao-invalida` (400), `/erros/nao-autenticado`
    (401), `/erros/acesso-negado` (403), `/erros/nao-aceitavel` (406), `/erros/interno` (500).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /consolidado:
    get:
      operationId: consultarConsolidado
      summary: Consolidado diário de um período
      description: |
        Um item por dia de `dataInicio` a `dataFim` (inclusivos), em ordem crescente; dias sem
        movimento vêm zerados, com `atualizadoEm: null`. No máximo 366 dias, contando os dois
        extremos (Q-052); datas futuras são aceitas e vêm zeradas. `saldoAnterior` e os dias
        vêm do mesmo instante da projeção (Q-053). Parâmetro desconhecido (inclusive
        `comercianteId`) ou repetido responde 400. Responde só `application/json`; um `Accept` que
        não o admita responde 406 (o OpenAPI 3.1 não permite declarar `Accept` como parâmetro).
        Exige o scope `consolidado:read`.
      security:
        - bearerAuth: [consolidado:read]
      parameters:
        - $ref: '#/components/parameters/DataInicio'
        - $ref: '#/components/parameters/DataFim'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          $ref: '#/components/responses/Periodo'
        '400':
          $ref: '#/components/responses/RequisicaoInvalidaDoPeriodo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '406':
          $ref: '#/components/responses/NaoAceitavel'
        '500':
          $ref: '#/components/responses/Interno'

  /consolidado/{data}:
    get:
      operationId: consultarDia
      summary: Consolidado de um dia
      description: |
        O dia, com o `saldoAcumulado` desde o início (todos os dias até ele). Sem movimento,
        responde 200 com zeros (AC-005.4). Não aceita parâmetros de query. Responde só
        `application/json`; um `Accept` que não o admita responde 406. Exige o scope
        `consolidado:read`.
      security:
        - bearerAuth: [consolidado:read]
      parameters:
        - $ref: '#/components/parameters/Data'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          $ref: '#/components/responses/Dia'
        '400':
          $ref: '#/components/responses/RequisicaoInvalidaDoDia'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '406':
          $ref: '#/components/responses/NaoAceitavel'
        '500':
          $ref: '#/components/responses/Interno'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT RS256 com `iss`, `aud` (inclui `consolidado-api`), `exp` e o claim `merchant_id`
        (UUID). Localmente, gere com
        `java scripts/DevToken.java --merchant <uuid> --scopes consolidado:read --ttl 3600`.

  parameters:
    DataInicio:
      name: dataInicio
      in: query
      required: true
      description: Primeiro dia do período, inclusivo (AAAA-MM-DD).
      schema:
        type: string
        format: date
      example: '2026-10-18'
    DataFim:
      name: dataFim
      in: query
      required: true
      description: |
        Último dia do período, inclusivo (AAAA-MM-DD). Anterior a `dataInicio` responde 400
        `intervalo-invalido`; mais de 366 dias no período, 400 `intervalo-maximo`.
      schema:
        type: string
        format: date
      example: '2026-10-21'
    Data:
      name: data
      in: path
      required: true
      description: O dia (AAAA-MM-DD); outro formato responde 400 `formato-invalido`.
      schema:
        type: string
        format: date
      example: '2026-10-21'
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Identificador da requisição para suporte. Se ausente ou fora do formato, a API gera um
        (nunca rejeita); o valor usado volta sempre no cabeçalho de resposta.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
      example: cliente-req-8f2c1

  headers:
    XRequestId:
      description: Request ID usado (o do cliente, se válido, ou um gerado).
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'

  schemas:
    Total:
      type: string
      description: Valor não negativo em BRL, string decimal com 2 casas.
      pattern: '^[0-9]+\.[0-9]{2}$'
    Saldo:
      type: string
      description: Saldo em BRL, string decimal com 2 casas; pode ser negativo (A6).
      pattern: '^-?[0-9]+\.[0-9]{2}$'

    DiaConsolidado:
      type: object
      additionalProperties: false
      required:
        - data
        - totalCreditos
        - totalDebitos
        - totalEstornosCredito
        - totalEstornosDebito
        - saldoDia
        - saldoAcumulado
        - qtdLancamentos
        - atualizadoEm
      properties:
        data:
          type: string
          format: date
        totalCreditos:
          $ref: '#/components/schemas/Total'
        totalDebitos:
          $ref: '#/components/schemas/Total'
        totalEstornosCredito:
          $ref: '#/components/schemas/Total'
        totalEstornosDebito:
          $ref: '#/components/schemas/Total'
        saldoDia:
          $ref: '#/components/schemas/Saldo'
        saldoAcumulado:
          $ref: '#/components/schemas/Saldo'
        qtdLancamentos:
          type: integer
          minimum: 0
        atualizadoEm:
          type: [string, 'null']
          format: date-time
          description: Instante UTC da última atualização do dia; `null` num dia sem movimento.

    Consolidado:
      type: object
      additionalProperties: false
      required: [comercianteId, dataInicio, dataFim, saldoAnterior, dias]
      properties:
        comercianteId:
          type: string
          format: uuid
        dataInicio:
          type: string
          format: date
        dataFim:
          type: string
          format: date
        saldoAnterior:
          $ref: '#/components/schemas/Saldo'
        dias:
          type: array
          minItems: 1
          maxItems: 366
          items:
            $ref: '#/components/schemas/DiaConsolidado'

    ErroDeCampo:
      type: object
      additionalProperties: false
      required: [campo, codigo, mensagem]
      properties:
        campo:
          type: string
          description: Nome do parâmetro de query ou de caminho.
        codigo:
          type: string
          description: |
            Código estável do erro: `obrigatorio`, `formato-invalido`, `intervalo-invalido`,
            `intervalo-maximo`, `parametro-desconhecido` ou `parametro-repetido`.
        mensagem:
          type: string

    Problema:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, requestId, timestamp]
      properties:
        type:
          type: string
          enum:
            - /erros/requisicao-invalida
            - /erros/nao-autenticado
            - /erros/acesso-negado
            - /erros/nao-aceitavel
            - /erros/payload-muito-grande
            - /erros/interno
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErroDeCampo'
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        traceId:
          type: string
          description: Presente quando houver tracing (T-032).
        timestamp:
          type: string
          format: date-time

  responses:
    Periodo:
      description: Um item por dia do período, com saldo anterior e acumulado.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Consolidado'
          examples:
            semana-com-movimento:
              summary: Quatro dias, um sem movimento e estornos de crédito e de débito
              value:
                comercianteId: 0f8fad5b-d9cb-469f-a165-70867728950e
                dataInicio: '2026-10-18'
                dataFim: '2026-10-21'
                saldoAnterior: '500.00'
                dias:
                  - data: '2026-10-18'
                    totalCreditos: '1000.00'
                    totalDebitos: '0.00'
                    totalEstornosCredito: '0.00'
                    totalEstornosDebito: '0.00'
                    saldoDia: '1000.00'
                    saldoAcumulado: '1500.00'
                    qtdLancamentos: 2
                    atualizadoEm: '2026-10-18T20:15:03.120456Z'
                  - data: '2026-10-19'
                    totalCreditos: '0.00'
                    totalDebitos: '0.00'
                    totalEstornosCredito: '0.00'
                    totalEstornosDebito: '0.00'
                    saldoDia: '0.00'
                    saldoAcumulado: '1500.00'
                    qtdLancamentos: 0
                    atualizadoEm: null
                  - data: '2026-10-20'
                    totalCreditos: '0.00'
                    totalDebitos: '250.00'
                    totalEstornosCredito: '100.00'
                    totalEstornosDebito: '0.00'
                    saldoDia: '-350.00'
                    saldoAcumulado: '1150.00'
                    qtdLancamentos: 2
                    atualizadoEm: '2026-10-20T13:02:11.004001Z'
                  - data: '2026-10-21'
                    totalCreditos: '80.00'
                    totalDebitos: '0.00'
                    totalEstornosCredito: '0.00'
                    totalEstornosDebito: '250.00'
                    saldoDia: '330.00'
                    saldoAcumulado: '1480.00'
                    qtdLancamentos: 2
                    atualizadoEm: '2026-10-21T14:03:12Z'
            periodo-sem-movimento:
              summary: Comerciante sem lançamentos no período nem antes dele
              value:
                comercianteId: 0f8fad5b-d9cb-469f-a165-70867728950e
                dataInicio: '2026-10-01'
                dataFim: '2026-10-02'
                saldoAnterior: '0.00'
                dias:
                  - data: '2026-10-01'
                    totalCreditos: '0.00'
                    totalDebitos: '0.00'
                    totalEstornosCredito: '0.00'
                    totalEstornosDebito: '0.00'
                    saldoDia: '0.00'
                    saldoAcumulado: '0.00'
                    qtdLancamentos: 0
                    atualizadoEm: null
                  - data: '2026-10-02'
                    totalCreditos: '0.00'
                    totalDebitos: '0.00'
                    totalEstornosCredito: '0.00'
                    totalEstornosDebito: '0.00'
                    saldoDia: '0.00'
                    saldoAcumulado: '0.00'
                    qtdLancamentos: 0
                    atualizadoEm: null
            saldo-anterior-negativo:
              summary: Débitos não limitados por saldo (A6), um único dia
              value:
                comercianteId: 0f8fad5b-d9cb-469f-a165-70867728950e
                dataInicio: '2026-10-22'
                dataFim: '2026-10-22'
                saldoAnterior: '-120.50'
                dias:
                  - data: '2026-10-22'
                    totalCreditos: '20.00'
                    totalDebitos: '0.00'
                    totalEstornosCredito: '0.00'
                    totalEstornosDebito: '0.00'
                    saldoDia: '20.00'
                    saldoAcumulado: '-100.50'
                    qtdLancamentos: 1
                    atualizadoEm: '2026-10-22T18:40:00Z'

    Dia:
      description: O dia, com o saldo acumulado desde o início.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiaConsolidado'
          examples:
            dia-com-movimento:
              value:
                data: '2026-10-21'
                totalCreditos: '80.00'
                totalDebitos: '0.00'
                totalEstornosCredito: '0.00'
                totalEstornosDebito: '250.00'
                saldoDia: '330.00'
                saldoAcumulado: '1480.00'
                qtdLancamentos: 2
                atualizadoEm: '2026-10-21T14:03:12Z'
            dia-sem-movimento:
              value:
                data: '2026-10-19'
                totalCreditos: '0.00'
                totalDebitos: '0.00'
                totalEstornosCredito: '0.00'
                totalEstornosDebito: '0.00'
                saldoDia: '0.00'
                saldoAcumulado: '1500.00'
                qtdLancamentos: 0
                atualizadoEm: null

    RequisicaoInvalidaDoPeriodo:
      description: Parâmetros inválidos; todos os erros em `errors[]`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            parametro-ausente:
              value:
                type: /erros/requisicao-invalida
                title: Bad Request
                status: 400
                detail: a requisição tem erros; veja errors[]
                instance: /api/v1/consolidado
                errors:
                  - campo: dataFim
                    codigo: obrigatorio
                    mensagem: dataFim é obrigatório
                requestId: cliente-req-8f2c1
                timestamp: '2026-10-23T15:00:00Z'
            intervalo-invalido:
              value:
                type: /erros/requisicao-invalida
                title: Bad Request
                status: 400
                detail: a requisição tem erros; veja errors[]
                instance: /api/v1/consolidado
                errors:
                  - campo: dataInicio
                    codigo: intervalo-invalido
                    mensagem: dataInicio não pode ser posterior a dataFim
                requestId: cliente-req-8f2c1
                timestamp: '2026-10-23T15:00:00Z'
            intervalo-maximo:
              value:
                type: /erros/requisicao-invalida
                title: Bad Request
                status: 400
                detail: a requisição tem erros; veja errors[]
                instance: /api/v1/consolidado
                errors:
                  - campo: dataFim
                    codigo: intervalo-maximo
                    mensagem: o período tem no máximo 366 dias, contando os dois extremos
                requestId: cliente-req-8f2c1
                timestamp: '2026-10-23T15:00:00Z'
            data-invalida:
              value:
                type: /erros/requisicao-invalida
                title: Bad Request
                status: 400
                detail: a requisição tem erros; veja errors[]
                instance: /api/v1/consolidado
                errors:
                  - campo: dataInicio
                    codigo: formato-invalido
                    mensagem: dataInicio deve ser uma data AAAA-MM-DD
                requestId: cliente-req-8f2c1
                timestamp: '2026-10-23T15:00:00Z'
            parametro-desconhecido:
              summary: comercianteId na query (vem só do token)
              value:
                type: /erros/requisicao-invalida
                title: Bad Request
                status: 400
                detail: a requisição tem erros; veja errors[]
                instance: /api/v1/consolidado
                errors:
                  - campo: comercianteId
                    codigo: parametro-desconhecido
                    mensagem: parâmetro não previsto no contrato
                requestId: cliente-req-8f2c1
                timestamp: '2026-10-23T15:00:00Z'

    RequisicaoInvalidaDoDia:
      description: Data inválida ou parâmetro de query não previsto.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            data-invalida:
              value:
                type: /erros/requisicao-invalida
                title: Bad Request
                status: 400
                detail: a requisição tem erros; veja errors[]
                instance: /api/v1/consolidado/2026-02-30
                errors:
                  - campo: data
                    codigo: formato-invalido
                    mensagem: data deve ser uma data AAAA-MM-DD
                requestId: cliente-req-8f2c1
                timestamp: '2026-10-23T15:00:00Z'
            parametro-desconhecido:
              value:
                type: /erros/requisicao-invalida
                title: Bad Request
                status: 400
                detail: a requisição tem erros; veja errors[]
                instance: /api/v1/consolidado/2026-10-21
                errors:
                  - campo: comercianteId
                    codigo: parametro-desconhecido
                    mensagem: parâmetro não previsto no contrato
                requestId: cliente-req-8f2c1
                timestamp: '2026-10-23T15:00:00Z'

    NaoAutenticado:
      description: Sem token ou token inválido; cabeçalho `WWW-Authenticate` com `Bearer`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            token-invalido:
              value:
                type: /erros/nao-autenticado
                title: Unauthorized
                status: 401
                detail: token ausente ou inválido
                instance: /api/v1/consolidado
                requestId: cliente-req-8f2c1
                timestamp: '2026-10-23T15:00:00Z'

    AcessoNegado:
      description: Token válido sem o scope `consolidado:read`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer error="insufficient_scope"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            sem-scope:
              value:
                type: /erros/acesso-negado
                title: Forbidden
                status: 403
                detail: o token não tem o scope exigido por esta operação
                instance: /api/v1/consolidado
                requestId: cliente-req-8f2c1
                timestamp: '2026-10-23T15:00:00Z'

    NaoAceitavel:
      description: O cabeçalho `Accept` não admite `application/json`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            accept-xml:
              value:
                type: /erros/nao-aceitavel
                title: Not Acceptable
                status: 406
                detail: esta API responde application/json
                instance: /api/v1/consolidado
                requestId: cliente-req-8f2c1
                timestamp: '2026-10-23T15:00:00Z'

    MetodoNaoPermitido:
      description: |
        `OPTIONS` em qualquer rota de `/api/v1/**` (inclusive um *preflight* CORS): a API não expõe
        CORS nem responde a `OPTIONS` (Q-067). Resposta de erro comum, sem operação nova no contrato.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            options:
              value:
                type: /erros/metodo-nao-permitido
                title: Method Not Allowed
                status: 405
                detail: 'OPTIONS não é permitido: a API não responde a preflight nem expõe CORS'
                instance: /api/v1/consolidado
                requestId: cliente-req-8f2c1
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                timestamp: '2026-10-23T15:00:00Z'

    Interno:
      description: Erro inesperado; o detalhe é genérico e a causa fica só no log.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            erro-interno:
              value:
                type: /erros/interno
                title: Internal Server Error
                status: 500
                detail: erro interno; tente novamente
                instance: /api/v1/consolidado
                requestId: cliente-req-8f2c1
                timestamp: '2026-10-23T15:00:00Z'
