# Credenciais só por variável de ambiente (valores de dev em .env.example, T-004); nenhum segredo aqui.
server:
  port: 8082
  error:
    include-stacktrace: never

spring:
  web:
    resources:
      # Sem recursos estáticos fora do contrato: Swagger UI e webjars só no profile local (ContratoConfig).
      add-mappings: false
  datasource:
    # A aplicação opera como consolidado_app (D-15): sem DDL e sem DELETE.
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/consolidado
    username: consolidado_app
    password: ${CONSOLIDADO_APP_PASSWORD:}
    # Pool da API (03 §7.1); o consumidor tem pool próprio, máx. 4 (ConsumidorConfig, T-022).
    hikari:
      pool-name: api
      maximum-pool-size: 10
  flyway:
    # O Flyway migra como consolidado_owner, dono do banco e das tabelas.
    user: consolidado_owner
    password: ${CONSOLIDADO_OWNER_PASSWORD:}
  kafka:
    # Broker local do compose (T-004); outro ambiente informa KAFKA_BOOTSTRAP_SERVERS.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_PORT:9092}}
    template:
      # Observação do envio da DLT (Q-061).
      observation-enabled: true
    consumer:
      # 03 §7.1 e Q-047: lote do poll, grupo novo lê desde o começo da retenção, offset manual.
      max-poll-records: 100
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Só para a DLT: idempotente e acks=all, como o produtor do Lançamentos.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
    listener:
      # Q-044: o offset de cada registro só é confirmado depois que o listener retorna (o commit).
      ack-mode: record
      # Observação do consumo: continua o trace do publicador pelo traceparent (Q-061).
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Sem padrão de desenvolvimento (Q-012, Q-050): fora do profile local, vêm do ambiente.
          public-key-location: ${CONSOLIDADO_JWT_PUBLIC_KEY_LOCATION:}
          issuer-uri: ${CONSOLIDADO_JWT_ISSUER:}
          audiences: ${CONSOLIDADO_JWT_AUDIENCE:}


# Observabilidade (03 §5, §8; Q-061, Q-062): Actuator em porta de gestão separada, sem autenticação
# (nunca publicada para fora no alvo, ADR-010), só health (sem detalhes) e prometheus. Tracing com a
# ponte OpenTelemetry, amostragem 100 % e nenhum exportador: o traceId aparece nos logs e no problem+json.
management:
  server:
    port: ${CONSOLIDADO_MANAGEMENT_PORT:9082}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
    logging:
      export:
        otlp:
          enabled: false

# Logs JSON com o MDC (requestId, eventId), como no Lançamentos (ADR-008, Q-049).
logging:
  structured:
    format:
      console: logstash

# Consumidor (D-10, 03 §7.1, Q-047): valores iniciais, revistos na T-033.
consolidado:
  consumer:
    enabled: true
    group-id: consolidado-projecao
    concurrency: 1
    pool-size: 4
