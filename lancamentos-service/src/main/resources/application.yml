# Credenciais só por variável de ambiente (valores de dev em .env.example, T-004); nenhum segredo aqui.
server:
  port: 8081
  error:
    include-stacktrace: never

spring:
  web:
    resources:
      # Sem recursos estáticos fora do contrato: Swagger UI e webjars só no profile local (ContratoConfig).
      add-mappings: false
  datasource:
    # A aplicação opera como lancamentos_app (D-15): SELECT/INSERT, sem DDL.
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/lancamentos
    username: lancamentos_app
    password: ${LANCAMENTOS_APP_PASSWORD:}
    # Pool da API (03 §7.1); o publicador da outbox tem pool próprio (PublicadorConfig, T-016).
    hikari:
      pool-name: api
      maximum-pool-size: 10
  kafka:
    # Broker local do compose (T-004); outro ambiente informa KAFKA_BOOTSTRAP_SERVERS.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_PORT:9092}}
    template:
      # Observação do envio: o traceparent W3C vai no cabeçalho da mensagem (Q-061).
      observation-enabled: true
    producer:
      # 03 §7.1: idempotente, acks=all e timeouts curtos para o publicador falhar rápido.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 3000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000
  flyway:
    # O Flyway migra como lancamentos_owner, dono do banco e das tabelas.
    user: lancamentos_owner
    password: ${LANCAMENTOS_OWNER_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Sem padrão de desenvolvimento (Q-012): fora do profile local, vêm do ambiente.
          public-key-location: ${LANCAMENTOS_JWT_PUBLIC_KEY_LOCATION:}
          issuer-uri: ${LANCAMENTOS_JWT_ISSUER:}
          audiences: ${LANCAMENTOS_JWT_AUDIENCE:}


# Observabilidade (03 §5, §8; Q-061, Q-062): Actuator em porta de gestão separada, sem autenticação
# (nunca publicada para fora no alvo, ADR-010), só health (sem detalhes) e prometheus. Tracing com a
# ponte OpenTelemetry, amostragem 100 % e nenhum exportador: o traceId aparece nos logs e no problem+json.
management:
  server:
    port: ${LANCAMENTOS_MANAGEMENT_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
    logging:
      export:
        otlp:
          enabled: false

# Logs JSON com o MDC (requestId, traceId e spanId do tracing).
logging:
  structured:
    format:
      console: logstash

# Regras de lançamento (constituição A4, A7, A11; Q-007).
lancamentos:
  max-valor: 10000000.00
  max-backdate-days: 30
  max-future-skew: 60s
  # Publicador e limpeza da outbox (03 §7.1, Q-028, Q-029): valores iniciais, revistos na T-033.
  outbox:
    retention-days: 7
    cleanup-interval: 1h
    publisher:
      enabled: true
      interval: 500ms
      max-backoff: 30s
      batch-size: 100
      transaction-timeout: 15s
      pool-size: 2
