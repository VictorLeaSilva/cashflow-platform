# Infraestrutura local (T-004, legibilidade na T-006). Na raiz do repositório:
#   cp .env.example .env
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --wait --remove-orphans
# Sem as variáveis, o compose falha cedo pedindo as senhas (nenhum segredo fica no repositório).
#
# Serviços (tabela completa no README, "Infraestrutura local"):
#   postgres       contínuo         banco das duas aplicações (bancos e roles separados)
#   kafka          contínuo         broker KRaft de nó único
#   kafka-topicos  execução única   cria o tópico de eventos e a DLT, termina com exit 0
#   kafka-ui       contínuo         UI do Kafka, só com o profile "tools"
#   prometheus     contínuo         métricas e alertas, só com o profile "observability" (T-032)
#   grafana        contínuo         painel de operação, só com o profile "observability" (T-032)
#   dev-keys       execução única   cria a chave JWT de desenvolvimento, só com o profile "apps" (T-035)
#   lancamentos    contínuo         serviço de Lançamentos em contêiner, só com o profile "apps" (T-035)
#   consolidado    contínuo         serviço de Consolidado em contêiner, só com o profile "apps" (T-035)
# Profiles: "tools", "observability" e "apps" (opcionais). As imagens dos serviços saem de
# ./mvnw -q install -DskipTests -Pimagens
name: fluxo-caixa

services:
  # Banco das aplicações (03 §3, D-15): bancos "lancamentos" e "consolidado", cada um com roles
  # owner/app próprios, criados por deploy/init/. Contínuo; porta no host ${POSTGRES_PORT:-5432}.
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina POSTGRES_SUPERUSER_PASSWORD (.env.example)}
      LANCAMENTOS_OWNER_PASSWORD: ${LANCAMENTOS_OWNER_PASSWORD:?defina LANCAMENTOS_OWNER_PASSWORD}
      LANCAMENTOS_APP_PASSWORD: ${LANCAMENTOS_APP_PASSWORD:?defina LANCAMENTOS_APP_PASSWORD}
      CONSOLIDADO_OWNER_PASSWORD: ${CONSOLIDADO_OWNER_PASSWORD:?defina CONSOLIDADO_OWNER_PASSWORD}
      CONSOLIDADO_APP_PASSWORD: ${CONSOLIDADO_APP_PASSWORD:?defina CONSOLIDADO_APP_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Saudável só depois que o init criou os bancos (o servidor temporário do init não escuta TCP).
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d consolidado -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Broker de eventos (ADR-004): Kafka em modo KRaft, nó único, sem criação automática de tópicos.
  # Contínuo; porta no host ${KAFKA_PORT:-9092}.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: entre contêineres (kafka:29092); EXTERNAL: serviços rodando no host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Criação dos tópicos (03 §4, §7.2): execução única, depois que o Kafka fica saudável. Roda
  # deploy/kafka/create-topics.sh (idempotente), que cria o tópico e a DLT e termina com exit 0.
  kafka-topicos:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
    restart: "no"

  # UI do Kafka para inspecionar tópicos e mensagens. Opcional: só sobe com --profile tools.
  # Contínuo; http://localhost:${KAFKA_UI_PORT:-8090}.
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"

  # Chave JWT de desenvolvimento (T-035, Q-064): execução única, só com --profile apps. Roda o
  # scripts/DevToken.java, que cria o par de chaves em deploy/dev-keys/ se ele ainda não existir (não
  # regrava um par existente) e termina. Os serviços esperam este término e montam a pasta só leitura.
  dev-keys:
    image: eclipse-temurin:25.0.1_8-jdk-noble
    profiles: ["apps"]
    working_dir: /work
    volumes:
      - ../scripts/DevToken.java:/work/scripts/DevToken.java:ro
      - ./dev-keys:/work/deploy/dev-keys
    entrypoint:
      - "sh"
      - "-c"
      - "java scripts/DevToken.java --merchant 00000000-0000-4000-8000-000000000000 --scopes lancamentos:read --ttl 60 > /dev/null"
    restart: "no"

  # Serviço de Lançamentos em contêiner (T-035, Q-064). Imagem gerada por spring-boot:build-image
  # (usuário não-root). Profile Spring "local" e só o que muda dentro da rede do compose: banco,
  # Kafka e o caminho da chave pública. Sem healthcheck (a imagem não tem curl nem shell): a saúde é
  # http://localhost:9081/actuator/health, que scripts/demo.sh espera. Portas: API 8081, gestão 9081.
  lancamentos:
    image: fluxo-caixa/lancamentos:0.1.0-SNAPSHOT
    pull_policy: never
    profiles: ["apps"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topicos:
        condition: service_completed_successfully
      dev-keys:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lancamentos
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLICKEYLOCATION: file:/dev-keys/jwt-public.pem
      LANCAMENTOS_OWNER_PASSWORD: ${LANCAMENTOS_OWNER_PASSWORD:?defina LANCAMENTOS_OWNER_PASSWORD}
      LANCAMENTOS_APP_PASSWORD: ${LANCAMENTOS_APP_PASSWORD:?defina LANCAMENTOS_APP_PASSWORD}
    volumes:
      - ./dev-keys:/dev-keys:ro
    ports:
      - "${LANCAMENTOS_PORT:-8081}:8081"
      - "${LANCAMENTOS_MANAGEMENT_PORT:-9081}:9081"

  # Serviço de Consolidado em contêiner (T-035, Q-064): mesma receita do Lançamentos.
  # Portas: API 8082, gestão 9082.
  consolidado:
    image: fluxo-caixa/consolidado:0.1.0-SNAPSHOT
    pull_policy: never
    profiles: ["apps"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topicos:
        condition: service_completed_successfully
      dev-keys:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/consolidado
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLICKEYLOCATION: file:/dev-keys/jwt-public.pem
      CONSOLIDADO_OWNER_PASSWORD: ${CONSOLIDADO_OWNER_PASSWORD:?defina CONSOLIDADO_OWNER_PASSWORD}
      CONSOLIDADO_APP_PASSWORD: ${CONSOLIDADO_APP_PASSWORD:?defina CONSOLIDADO_APP_PASSWORD}
    volumes:
      - ./dev-keys:/dev-keys:ro
    ports:
      - "${CONSOLIDADO_PORT:-8082}:8082"
      - "${CONSOLIDADO_MANAGEMENT_PORT:-9082}:9082"

  # Métricas e alertas (T-032, Q-062, 03 §8). Opcional: só sobe com --profile observability.
  # Raspa as portas de gestão dos serviços no host (9081 e 9082) por host.docker.internal, que o
  # host-gateway resolve no Docker Desktop e no Linux. Contínuo; http://localhost:${PROMETHEUS_PORT:-9090}.
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2d"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Painel de operação (T-032). Opcional: só sobe com --profile observability. Só para uso local:
  # acesso anônimo somente leitura e sem tela de login (nenhuma credencial no repositório).
  # Contínuo; http://localhost:${GRAFANA_PORT:-3000}.
  grafana:
    image: grafana/grafana:13.2.4
    profiles: ["observability"]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  kafka-data:
